[package]
name = "spyglass-core"
version = "0.1.0"
edition.workspace = true
description = "Spyglass core: index schema, read-only source adapters, watched-root scanner, search API"

[lib]
name = "spyglass_core"
crate-type = ["rlib"]

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
rusqlite_migration = "2.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8.5"
walkdir = "2.5.0"
thiserror = "2.0.18"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
quick-xml = "0.41"
